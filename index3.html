<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Calculator - By Bhavani</title>
<style>
body{font-family:Arial;background:#fff0f5;text-align:center;padding:20px}
.card{background:white;max-width:450px;margin:auto;padding:25px;border-radius:20px;box-shadow:0 4px 15px #ffc0d9}
h1{color:#d63384}
input{width:90%;padding:12px;margin:8px;font-size:18px;border:2px solid #ff9ec6;border-radius:10px;text-align:center}
button{padding:12px 16px;margin:5px;font-size:18px;border:none;border-radius:10px;background:#d63384;color:white;cursor:pointer}
button:hover{background:#a81e64}
#result{font-size:22px;font-weight:bold;margin:20px;color:#333;min-height:30px}
.clear{background:#888}
</style>
</head>
<body>
<div class="card">
<h1>🧮 My Calculator</h1>
<p>By Bhavani | EdBytes Milestone 5</p>
<input id="num1" type="number" placeholder="Enter first number">
<input id="num2" type="number" placeholder="Enter second number">
<br>
<button onclick="add()">+ Add</button>
<button onclick="subtract()">- Subtract</button>
<button onclick="multiply()">× Multiply</button>
<button onclick="divide()">÷ Divide</button>
<br>
<button class="clear" onclick="clearAll()">Clear</button>
<p id="result">Result will show here</p>
</div>

<script>
function getNumbers(){
  let a = document.getElementById("num1").value;
  let b = document.getElementById("num2").value;
  if(a==="" || b===""){
    document.getElementById("result").textContent="⚠️ Please enter both numbers!";
    document.getElementById("result").style.color="red";
    return null;
  }
  return [Number(a), Number(b)];
}
function add(){
  let n = getNumbers(); if(!n) return;
  document.getElementById("result").textContent = `Result: ${n[0]} + ${n[1]} = ${n[0]+n[1]}`;
  document.getElementById("result").style.color="green";
}
function subtract(){
  let n = getNumbers(); if(!n) return;
  document.getElementById("result").textContent = `Result: ${n[0]} - ${n[1]} = ${n[0]-n[1]}`;
  document.getElementById("result").style.color="green";
}
function multiply(){
  let n = getNumbers(); if(!n) return;
  document.getElementById("result").textContent = `Result: ${n[0]} × ${n[1]} = ${n[0]*n[1]}`;
  document.getElementById("result").style.color="green";
}
function divide(){
  let n = getNumbers(); if(!n) return;
  if(n[1]===0){
    document.getElementById("result").textContent="⚠️ Cannot divide by zero!";
    document.getElementById("result").style.color="red";
    return;
  }
  document.getElementById("result").textContent = `Result: ${n[0]} ÷ ${n[1]} = ${n[0]/n[1]}`;
  document.getElementById("result").style.color="green";
}
function clearAll(){
  document.getElementById("num1").value="";
  document.getElementById("num2").value="";
  document.getElementById("result").textContent="Result will show here";
  document.getElementById("result").style.color="#333";
}
</script>
</body>
</html>
